server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/datasync;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

logging:
  level:
    com.datasync: INFO
    org.springframework.batch: INFO
